<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestione Condomini</title></head><body><script>
const DB='condo_persistent_v1',STORE='kv',KEYS=['condo_archive_v5','condo_last_update_v5','condo_contacts_v5'];
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function restore(){try{const db=await openDb();const tx=db.transaction(STORE,'readonly'),st=tx.objectStore(STORE);for(const k of KEYS){if(localStorage.getItem(k))continue;const v=await new Promise(res=>{const q=st.get(k);q.onsuccess=()=>res(q.result||'');q.onerror=()=>res('')});if(v)localStorage.setItem(k,v)}db.close()}catch(e){}}
function boot(){fetch('legacy-v28.html?v=20260908g').then(r=>{if(!r.ok)throw new Error('Errore caricamento programma');return r.text()}).then(t=>{const patch='<scr'+'ipt src="archive-dropdown-v1.js?v=20260909-drop3"></scr'+'ipt><scr'+'ipt src="priority-fix.js?v=20260908g"></scr'+'ipt><scr'+'ipt src="app-v5.js?v=20260908g"></scr'+'ipt><scr'+'ipt src="persistent-cache-v1.js?v=20260909-cache1"></scr'+'ipt><scr'+'ipt src="whatsapp-v6.js?v=20260908g"></scr'+'ipt><scr'+'ipt src="engine-v6.js?v=20260909-engine1"></scr'+'ipt><scr'+'ipt src="engine-v6-monthfix.js?v=20260909-month2"></scr'+'ipt><scr'+'ipt src="drive-sync-v1.js?v=20260909-drive3"></scr'+'ipt>';t=t.replace('</body>',patch+'</body>');document.open();document.write(t);document.close()}).catch(e=>{document.body.innerHTML='<div style="font-family:system-ui;padding:20px">Impossibile avviare il gestionale: '+e.message+'</div>'})}
restore().finally(boot);
</script></body></html>
