<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>Condominio APP · TEST</title><style>body{margin:0;font-family:system-ui;background:#f3f5f8;color:#17324d}#boot{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#boot b{display:block;color:#7c3aed;margin-bottom:8px}</style></head><body><div id="boot"><div><b>VERSIONE TEST</b>Apertura Gestione Condomini…</div></div><script>
(async()=>{
 const boot=document.getElementById('boot');
 try{
  const r=await fetch('legacy-v28.html?v=20260909h',{cache:'no-store'});
  if(!r.ok)throw new Error('legacy-v28.html '+r.status);
  let t=await r.text();
  const banner='<div id="testVersionBanner" style="position:sticky;top:0;z-index:9999;background:#7c3aed;color:white;text-align:center;padding:7px 10px;font:700 13px system-ui">🧪 VERSIONE TEST · non è la versione stabile</div><div id="testLoadState" style="background:#fff3cd;color:#664d03;text-align:center;padding:6px 10px;font:700 12px system-ui">⏳ Caricamento moduli TEST…</div>';
  t=t.replace('<body>','<body>'+banner);
  const loader=`<script>(function(){
   const scripts=[
    'priority-fix.js?v=20260909h',
    'app-v5.js?v=20260909h',
    'engine-v6.js?v=20260911-conguagli5',
    'unit-identity-fix-v1.js?v=20260911-unit2',
    'conguaglio-position-fix-v2.js?v=20260911-rates4',
    'v1-source-order.js?v=20260911-order1',
    'v1-focus-ordinary-conguagli.js?v=20260911-v1focus1',
    'whatsapp-v6.js?v=20260909h',
    'data-safety-v6.js?v=20260909h',
    'v1-self-check.js?v=20260911-selfcheck1',
    'drive-sync-v2.js?v=20260911-fullrefresh2'
   ];
   const state=document.getElementById('testLoadState');
   function fail(msg){state.style.background='#f8d7da';state.style.color='#842029';state.textContent='❌ TEST NON PRONTO · '+msg;}
   function done(){
    setTimeout(function(){
     const ok=!!(window.condoDriveSyncV2&&window.condoSelfCheckV1&&window.condoV1SourceOrder&&window.condoV1Focus);
     const btn=document.getElementById('folderBtn');
     if(ok&&btn&&btn.textContent.trim()==='AGGIORNA'){
      state.style.background='#d1e7dd';state.style.color='#0f5132';state.textContent='✅ TEST PRONTO · moduli caricati · puoi premere AGGIORNA';
     }else fail('moduli incompleti: non premere AGGIORNA');
    },150);
   }
   function load(i){
    if(i>=scripts.length)return done();
    const s=document.createElement('script');s.src=scripts[i];s.async=false;
    s.onload=function(){load(i+1)};
    s.onerror=function(){fail('errore caricamento '+scripts[i])};
    document.body.appendChild(s);
   }
   load(0);
  })();<\/script>`;
  t=t.replace('</body>',loader+'</body>');
  document.open();document.write(t);document.close();
 }catch(e){
  boot.innerHTML='<div><b>VERSIONE TEST</b>Impossibile avviare il gestionale.<br><small>'+String(e.message||e)+'</small></div>';
 }
})();
</script></body></html>
