<body>
<div class="badge">TEST V3 · e10d1f97</div>

<iframe id="app" src="legacy-v28.html?testv3=20260912-sameorigin1" title="Gestione Condomini TEST V3"></iframe>
<script>
(()=>{
'use strict';
const REPO='sossiomormile/gestione-condomini-solleciti-e-invio-wathsapp-';
const TEST_SHA='e10d1f97ad136e63e15d4c6f11cc9fdf11d255d2';
const BASE=`https://cdn.jsdelivr.net/gh/${REPO}@${TEST_SHA}/`;
const scripts=[
'priority-fix.js','app-v5.js','engine-v6.js','unit-identity-fix-v1.js','conguaglio-position-fix-v2.js','duplicate-unit-rebuild-v2.js','duplicate-conguaglio-position-fix-v3.js','ordinary-cent-guard-v1.js','v1-source-order.js','v1-focus-ordinary-conguagli.js','folder-name-fix-v1.js','whatsapp-v6.js','data-safety-v6.js','unit-contact-identity-v1.js','v1-self-check.js','v1-self-check-unresolved-v3.js','v1-self-check-cents-v2.js','v1-deep-check-v2.js','v1-cent-consistency-v1.js','drive-sync-v3.js'
];
const frame=document.getElementById('app'),boot=document.getElementById('boot');
function fail(msg){boot.textContent='TEST V3 · '+msg;boot.style.color='#8b1e1e';boot.style.display='flex'}
function loadOne(doc,i){
 if(i>=scripts.length){
   try{
     const mark=doc.createElement('div');
     mark.textContent='TEST V3 · '+TEST_SHA.slice(0,8)+' · origin '+doc.location.origin;
     mark.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;background:#8b1e1e;color:#fff;padding:5px 8px;border-radius:8px;font:700 10px system-ui;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
     doc.body.appendChild(mark);
   }catch(e){}
   boot.style.display='none';
   return;
 }
 const s=doc.createElement('script');
 s.src=BASE+scripts[i]+'?testv3=20260912-sameorigin1';
 s.onload=()=>loadOne(doc,i+1);
 s.onerror=()=>fail('Errore caricamento '+scripts[i]);
 doc.body.appendChild(s);
}
frame.addEventListener('load',()=>{
 try{
   const win=frame.contentWindow,doc=frame.contentDocument;
   if(!win||!doc)throw new Error('pagina TEST non accessibile');
   if(win.location.origin!==location.origin)throw new Error('origine non valida: '+win.location.origin);
   loadOne(doc,0);
 }catch(e){fail(e.message)}
},{once:true});
})();
</script>
