<script>
(async()=>{
'use strict';
const TEST_SHA='e10d1f97ad136e63e15d4c6f11cc9fdf11d255d2';
const REPO='sossiomormile/gestione-condomini-solleciti-e-invio-wathsapp-';
const BASE=`https://cdn.jsdelivr.net/gh/${REPO}@${TEST_SHA}/`;
const EXPECTED_ORIGIN='https://sossiomormile.github.io';
const scriptsV3=[
'priority-fix.js','app-v5.js','engine-v6.js','unit-identity-fix-v1.js','conguaglio-position-fix-v2.js','duplicate-unit-rebuild-v2.js','duplicate-conguaglio-position-fix-v3.js','ordinary-cent-guard-v1.js','v1-source-order.js','v1-focus-ordinary-conguagli.js','folder-name-fix-v1.js','whatsapp-v6.js','data-safety-v6.js','unit-contact-identity-v1.js','v1-self-check.js','v1-self-check-unresolved-v3.js','v1-self-check-cents-v2.js','v1-deep-check-v2.js','v1-cent-consistency-v1.js','drive-sync-v3.js'
];
function showError(msg){document.documentElement.innerHTML='<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST V3</title></head><body style="font-family:system-ui;padding:24px;background:#f3f5f8;color:#8b1e1e"><h2>TEST V3</h2><p>'+String(msg).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p></body>'}
function runScript(spec){return new Promise((resolve,reject)=>{const s=document.createElement('script');if(spec.type)s.type=spec.type;if(spec.src){s.src=spec.src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Errore caricamento '+spec.src));}else{s.textContent=spec.code;}const parent=spec.parent==='head'?document.head:document.body;parent.appendChild(s);if(!spec.src)resolve();});}
try{
 if(location.origin!==EXPECTED_ORIGIN)throw new Error('Origine non valida: '+location.origin);
 const r=await fetch('legacy-v28.html?testv3=20260912-domloader1',{cache:'no-store'});
 if(!r.ok)throw new Error('legacy-v28.html HTTP '+r.status);
 const html=await r.text();
 const parsed=new DOMParser().parseFromString(html,'text/html');
 const legacyScripts=[];
 parsed.querySelectorAll('script').forEach(s=>{legacyScripts.push({src:s.getAttribute('src')||'',type:s.getAttribute('type')||'',code:s.textContent||'',parent:s.parentNode===parsed.head?'head':'body'});s.remove();});
 document.head.innerHTML=parsed.head.innerHTML;
 document.body.innerHTML=parsed.body.innerHTML;
 for(const spec of legacyScripts)await runScript(spec);
 for(const name of scriptsV3)await runScript({src:BASE+name+'?testv3=20260912-domloader1',parent:'body'});
 const mark=document.createElement('div');
 mark.textContent='TEST V3 · '+TEST_SHA.slice(0,8)+' · origin '+location.origin;
 mark.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;background:#8b1e1e;color:#fff;padding:5px 8px;border-radius:8px;font:700 10px system-ui;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
 document.body.appendChild(mark);
}catch(e){showError(e.message||e);}
})();
