<script>
(async()=>{
'use strict';
document.getElementById('origin').textContent=location.origin;
const names=['testv3-priority-fix.js','testv3-app-v5.js','testv3-engine-v6.js','testv3-unit-identity-fix-v1.js','testv3-conguaglio-position-fix-v2.js','testv3-duplicate-unit-rebuild-v2.js','testv3-duplicate-conguaglio-position-fix-v3.js','testv3-ordinary-cent-guard-v1.js','testv3-v1-source-order.js','testv3-v1-focus-ordinary-conguagli.js','testv3-folder-name-fix-v1.js','testv3-whatsapp-v6.js','testv3-data-safety-v6.js','testv3-unit-contact-identity-v1.js','testv3-v1-self-check.js','testv3-v1-self-check-unresolved-v3.js','testv3-v1-self-check-cents-v2.js','testv3-v1-deep-check-v2.js','testv3-v1-cent-consistency-v1.js','testv3-drive-sync-v3.js'];
function load(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+'?v=20260912-rootfinal1';s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('Errore caricamento '+src));document.body.appendChild(s);});}
try{
 const r=await fetch('legacy-v28.html?v=20260912-rootfinal1',{cache:'no-store'});if(!r.ok)throw new Error('legacy-v28.html HTTP '+r.status);
 const html=await r.text(),parsed=new DOMParser().parseFromString(html,'text/html');
 const legacy=[];parsed.querySelectorAll('script').forEach(s=>{legacy.push({src:s.getAttribute('src')||'',code:s.textContent||'',parent:s.parentNode===parsed.head?'head':'body'});s.remove();});
 document.head.innerHTML=parsed.head.innerHTML+'<style>.diag{position:fixed;left:8px;bottom:8px;z-index:100000;background:#8b1e1e;color:#fff;padding:5px 8px;border-radius:8px;font:700 10px system-ui;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>';
 document.body.innerHTML=parsed.body.innerHTML+'<div class="diag">TEST V3 · e10d1f97 · origin: '+location.origin+'</div>';
 for(const x of legacy){if(x.src){await load(x.src);}else if(x.code){const s=document.createElement('script');s.textContent=x.code;(x.parent==='head'?document.head:document.body).appendChild(s);}}
 for(const n of names)await load(n);
}catch(e){document.body.innerHTML='<div style="font-family:system-ui;padding:24px;color:#8b1e1e"><h2>TEST V3</h2><p>'+String(e.message||e)+'</p><p>Origin: '+location.origin+'</p></div>';}
})();
