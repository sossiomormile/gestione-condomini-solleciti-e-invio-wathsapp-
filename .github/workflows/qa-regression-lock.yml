name: Condominio App - QA Lock

on:
  push:
    branches:
      - Condominio_App-1.0-test
  pull_request:
    branches:
      - Condominio_App-1.0-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test source order
        run: node qa/test-source-order.mjs
      - name: Test V1 operational focus
        run: node qa/test-v1-focus.mjs
      - name: Test Drive full refresh transaction
        run: node qa/test-drive-full-refresh.mjs
      - name: Verify protected behavior and change authorization
        run: node qa/verify-protected-behavior.mjs
