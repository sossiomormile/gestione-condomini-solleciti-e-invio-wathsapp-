name: Condominio App - Public Pages Production Smoke

on:
  push:
    branches:
      - main
      - 'release-main-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test public launcher mapping
        run: node qa/test-public-pages-launcher-v5.mjs
      - name: Install Playwright Chromium
        if: github.ref == 'refs/heads/main'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages deployment
        if: github.ref == 'refs/heads/main'
        env:
          PAGE_URL: https://sossiomormile.github.io/gestione-condomini-solleciti-e-invio-wathsapp-/index.html
        run: |
          for i in {1..60}; do
            HTML="$(curl -fsSL "$PAGE_URL?build=$GITHUB_SHA" || true)"
            if printf '%s' "$HTML" | grep -q "STABLE_SHA='7a2a270730f5e72fdb0067da762be12f981336c0'" \
              && printf '%s' "$HTML" | grep -q "android-local-folder-guard-v1.js" \
              && printf '%s' "$HTML" | grep -q "drive-sync-v4.js"; then
              echo "GitHub Pages aggiornato alla stabile Android/Drive V4"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages non ha esposto la nuova produzione entro il timeout"
          exit 1
      - name: Android public production smoke
        if: github.ref == 'refs/heads/main'
        env:
          PUBLIC_URL: https://sossiomormile.github.io/gestione-condomini-solleciti-e-invio-wathsapp-/index.html?build=${{ github.sha }}
        run: node qa/test-public-pages-production.mjs
