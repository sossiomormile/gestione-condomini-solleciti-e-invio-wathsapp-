name: Condominio App - Mobile Runtime Smoke

on:
  push:
    branches:
      - Condominio_App-1.0-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local TEST app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/condominio-http.log 2>&1 &
          echo $! >/tmp/condominio-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/app-current.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/condominio-http.log
          exit 1
      - name: Android viewport runtime smoke test
        run: node qa/test-mobile-runtime-browser.mjs
